<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Smart Home richtig bedienen</title>
  <desc id="desc">Smart-Home-Bedienung mit App, Sprachsteuerung, Touchpanel, klassischen Tastern, automatischen Szenen und mehreren Nutzern.</desc>
