  <rect x="70" y="70" width="1140" height="620" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#0b1220">Smart Home Raum für Raum planen</text>
  <rect x="150" y="175" width="980" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
