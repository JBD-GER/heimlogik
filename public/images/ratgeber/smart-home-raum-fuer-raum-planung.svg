      <rect x="515" y="215" width="250" height="135" rx="16" fill="#ecfeff"/>
      <rect x="840" y="215" width="250" height="135" rx="16" fill="#ecfdf5"/>
      <rect x="190" y="410" width="250" height="135" rx="16" fill="#ecfeff"/>
