      <rect x="840" y="410" width="250" height="135" rx="16" fill="#ecfeff"/>
    </g>
    <text x="315" y="268" font-size="20" font-weight="700" fill="#0b1220">Wohnen</text>
    <text x="315" y="300" font-size="15" fill="#334155">Licht / Audio / Szenen</text>
    <text x="640" y="268" font-size="20" font-weight="700" fill="#0b1220">Küche</text>
    <text x="640" y="300" font-size="15" fill="#334155">Arbeitslicht / Präsenz</text>
    <text x="965" y="268" font-size="20" font-weight="700" fill="#0b1220">Bad</text>
