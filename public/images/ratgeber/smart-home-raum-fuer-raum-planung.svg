<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Smart Home Raum für Raum planen</title>
  <desc id="desc">Raum-für-Raum-Planung für Smart Home mit Wohnzimmer, Küche, Bad, Schlafzimmer, Flur, Garten, Technikraum, Licht, Heizung, Sensorik und Bedienung.</desc>
