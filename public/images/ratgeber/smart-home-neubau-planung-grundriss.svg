  <rect x="214" y="622" width="852" height="42" rx="21" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="649" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1220">Früh planen heißt: sauber vorbereiten, nicht alles sofort kaufen.</text>
