<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Smart Home im Neubau richtig vorbereiten</title>
  <desc id="desc">Ruhige Infografik zur Smart-Home-Planung im Neubau mit Grundriss, Technikraum, KNX-Bus, Netzwerk, Licht, Beschattung, Audio und WLAN.</desc>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <rect x="72" y="70" width="1136" height="620" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0b1220">Smart Home im Neubau richtig vorbereiten</text>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Was vor der Elektroplanung geklärt werden sollte</text>

  <rect x="168" y="205" width="700" height="390" rx="10" fill="#f8fafc" stroke="#0b1220" stroke-width="5"/>
  <path d="M168 360h700M390 205v390M620 205v390" stroke="#0b1220" stroke-width="4"/>
  <path d="M390 300h-52M620 468h-52M620 298h54" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>

