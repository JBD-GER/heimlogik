    <text x="505" y="242" text-anchor="middle" font-size="15" font-weight="700">Wohnen</text>
    <text x="744" y="242" text-anchor="middle" font-size="15" font-weight="700">Küche</text>
    <text x="278" y="395" text-anchor="middle" font-size="15" font-weight="700">Eingang</text>
    <text x="505" y="395" text-anchor="middle" font-size="15" font-weight="700">Arbeiten</text>
    <text x="744" y="395" text-anchor="middle" font-size="15" font-weight="700">Schlafen</text>
  </g>

  <g fill="#ecfdf5" stroke="#22c55e" stroke-width="3">
    <rect x="214" y="268" width="128" height="54" rx="8"/>
    <rect x="442" y="274" width="126" height="46" rx="23"/>
    <rect x="682" y="274" width="126" height="46" rx="23"/>
    <rect x="442" y="438" width="126" height="46" rx="23"/>
    <rect x="682" y="438" width="126" height="46" rx="23"/>
  </g>

  <g fill="#ecfeff" stroke="#06b6d4" stroke-width="3">
    <circle cx="278" cy="485" r="24"/>
    <circle cx="505" cy="302" r="22"/>
    <circle cx="744" cy="302" r="22"/>
    <circle cx="505" cy="468" r="22"/>
    <circle cx="744" cy="468" r="22"/>
  </g>

  <g stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M278 295C395 252 552 252 744 296"/>
    <path d="M278 295C390 425 530 458 744 462"/>
  </g>
  <g stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 10" fill="none" stroke-linecap="round">
    <path d="M278 485C395 535 600 535 744 468"/>
    <path d="M505 302c55 30 106 30 239 0"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#0b1220" text-anchor="middle" font-size="14">
    <text x="278" y="291" font-weight="700">Netzwerkschrank</text>
    <text x="505" y="303">Präsenz</text>
    <text x="744" y="303">WLAN</text>
    <text x="505" y="473">Audio</text>
    <text x="744" y="473">Touch</text>
    <text x="505" y="466" dy="-34" font-weight="700">Lichtkreis</text>
    <text x="744" y="466" dy="-34" font-weight="700">Beschattung</text>
  </g>

  <g>
    <rect x="918" y="218" width="220" height="330" rx="16" fill="#0b1220"/>
    <text x="1028" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Planungs-Check</text>
