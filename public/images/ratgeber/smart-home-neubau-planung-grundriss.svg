      <text x="960" y="315">1. Funktionen je Raum</text>
      <text x="960" y="360">2. KNX und Netzwerk</text>
      <text x="960" y="405">3. Licht und Rollläden</text>
      <text x="960" y="450">4. Technikraum</text>
